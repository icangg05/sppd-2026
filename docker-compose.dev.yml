services:
  app:
    build: .
    container_name: sppd_app
    ports:
      - "8007:80"
    depends_on:
      - db
    volumes:
      - .:/var/www/html
      - ./upload:/var/www/html/upload
    networks:
      - app_net

  db:
    image: mysql:8.0
    container_name: sppd_db
    restart: always
    environment:
      MYSQL_DATABASE: db_sppd
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sppd_phpmyadmin
    ports:
      - "8087:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root
    depends_on:
      - db
    networks:
      - app_net

networks:
  app_net:


volumes:
  dbdata:
