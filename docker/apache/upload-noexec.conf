# Folder upload hanya berisi gambar/dokumen: jangan pernah menjalankan skrip di sana,
# walaupun penyerang berhasil menaruh file .php/.phtml/.phar di dalamnya.
<Directory /var/www/html/upload>
	php_admin_flag engine off
	Options -Indexes -ExecCGI
	AllowOverride None
	<FilesMatch "(?i)\.(php\d?|phtml|pht|phps|phar|cgi|pl|py|sh|shtml|htaccess|user\.ini)$">
		Require all denied
	</FilesMatch>
</Directory>
